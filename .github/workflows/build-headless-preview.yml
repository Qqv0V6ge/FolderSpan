name: Build Headless Preview

on:
  workflow_dispatch:
    inputs:
      version:
        description: "目标版本（MAJOR.MINOR.PATCH，留空沿用最新发布版本）"
        required: false
        default: ""
        type: string
      build_linux_x64:
        description: "打包 Linux x64"
        type: boolean
        required: true
        default: true
      build_linux_arm64:
        description: "打包 Linux ARM64"
        type: boolean
        required: true
        default: true
      build_windows_x64:
        description: "打包 Windows x64"
        type: boolean
        required: true
        default: true
      build_windows_arm64:
        description: "打包 Windows ARM64"
        type: boolean
        required: true
        default: true
      build_macos_x64:
        description: "打包 macOS x64"
        type: boolean
        required: true
        default: true
      build_macos_arm64:
        description: "打包 macOS ARM64"
        type: boolean
        required: true
        default: true
permissions:
  contents: read

concurrency:
  group: build-headless-preview-${{ github.workflow }}-${{ github.ref }}-${{ inputs.build_linux_x64 }}${{ inputs.build_linux_arm64 }}${{ inputs.build_windows_x64 }}${{ inputs.build_windows_arm64 }}${{ inputs.build_macos_x64 }}${{ inputs.build_macos_arm64 }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  ORG_GRADLE_PROJECT_folderspanBuildType: release

jobs:
  targets:
    name: Select package platforms
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      apple_no_pro_build_number: ${{ steps.version.outputs.apple_no_pro_build_number }}
      apple_build_number: ${{ steps.version.outputs.apple_build_number }}
      windows_package_version: ${{ steps.version.outputs.windows_package_version }}
      android_version_code: ${{ steps.version.outputs.android_version_code }}
      source_revision: ${{ steps.version.outputs.source_revision }}
      version: ${{ steps.version.outputs.version }}
      native: ${{ steps.matrix.outputs.native }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Resolve install versions
        id: version
        env:
          BUILD_PRODUCT: headless
          BUILD_CHANNEL: preview
          BUILD_VERSION: ${{ inputs.version }}
        run: python3 scripts/ci/resolve-install-versions.py >> "$GITHUB_OUTPUT"
      - name: Select package platforms
        id: matrix
        env:
          BUILD_INPUTS: ${{ toJSON(inputs) }}
          PACKAGE_MATRIX: >-
            {
              "native": [
                {"label": "linux-x64", "os": "ubuntu-24.04", "tasks": ":app:headlessRuntime:packageReleaseTarGz", "paths": "app/headlessRuntime/build/compose/binaries/main-release/targz/*.tar.gz"},
                {"label": "linux-arm64", "os": "ubuntu-24.04-arm", "tasks": ":app:headlessRuntime:packageReleaseTarGz", "paths": "app/headlessRuntime/build/compose/binaries/main-release/targz/*.tar.gz"},
                {"label": "windows-x64", "os": "windows-2025", "tasks": ":app:headlessRuntime:packageReleaseMsi", "paths": "app/headlessRuntime/build/compose/binaries/main-release/msi/*.msi"},
                {"label": "windows-arm64", "os": "windows-11-arm", "tasks": ":app:headlessRuntime:createReleaseDistributable", "paths": "app/headlessRuntime/build/compose/binaries/main-release/zip/*.zip", "java_distribution": "microsoft"},
                {"label": "macos-x64", "os": "macos-15-intel", "tasks": ":app:headlessRuntime:packageReleaseDmg", "paths": "app/headlessRuntime/build/compose/binaries/main-release/dmg/*.dmg"},
                {"label": "macos-arm64", "os": "macos-15", "tasks": ":app:headlessRuntime:packageReleaseDmg", "paths": "app/headlessRuntime/build/compose/binaries/main-release/dmg/*.dmg"}
              ]
            }
        run: python3 scripts/ci/select-build-targets.py >> "$GITHUB_OUTPUT"

  quality:
    needs: targets
    uses: ./.github/workflows/shared-quality.yml
    secrets:
      PROMAIN_REPOSITORY_TOKEN: ${{ secrets.PROMAIN_REPOSITORY_TOKEN }}

  web:
    name: Package Web preview (${{ matrix.platform.label }}, ${{ matrix.edition }})
    needs: [targets, quality]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        edition: [pro]
        platform:
          - label: js
            target: js
          - label: wasm
            target: wasmJs
    env:
      ORG_GRADLE_PROJECT_releaseVersion: ${{ needs.targets.outputs.version }}
      NODE_OPTIONS: --max-old-space-size=8192
      ORG_GRADLE_PROJECT_includeProMain: ${{ matrix.edition == 'pro' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          token: ${{ matrix.edition == 'pro' && secrets.PROMAIN_REPOSITORY_TOKEN || github.token }}
          submodules: ${{ matrix.edition == 'pro' }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Web production distribution
        run: >-
          ./gradlew --no-daemon --max-workers=1
          :app:webApp:${{ matrix.platform.target }}BrowserDistribution
          --stacktrace

      - name: Create Web preview archive
        shell: bash
        run: |
          archive="$GITHUB_WORKSPACE/folderspan-web-${{ matrix.platform.label }}-${{ matrix.edition }}-preview-${GITHUB_SHA:0:7}.zip"
          cd app/webApp/build/dist/${{ matrix.platform.target }}/productionExecutable
          zip -q -r "$archive" .

      - name: Upload Web preview
        uses: actions/upload-artifact@v7
        with:
          name: preview-web-${{ matrix.platform.label }}-${{ matrix.edition }}
          path: folderspan-web-${{ matrix.platform.label }}-${{ matrix.edition }}-preview-*.zip
          if-no-files-found: error
          retention-days: 14

  headless-runtime:
    name: Package Headless Runtime preview (${{ matrix.platform.label }}, ${{ matrix.web_ui }}, ${{ matrix.edition }})
    needs: [targets, quality, web]
    if: needs.targets.outputs.native != '[]'
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        edition: [pro]
        web_ui: [none, js, wasm]
        platform: ${{ fromJSON(needs.targets.outputs.native) }}
    env:
      ORG_GRADLE_PROJECT_windowsPackageVersion: ${{ needs.targets.outputs.windows_package_version }}
      ORG_GRADLE_PROJECT_releaseVersion: ${{ needs.targets.outputs.version }}
      ORG_GRADLE_PROJECT_includeProMain: ${{ matrix.edition == 'pro' }}
      ORG_GRADLE_PROJECT_runtimeWebUi: ${{ matrix.web_ui }}
      ORG_GRADLE_PROJECT_folderspanBuildType: release
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          token: ${{ matrix.edition == 'pro' && secrets.PROMAIN_REPOSITORY_TOKEN || github.token }}
          submodules: ${{ matrix.edition == 'pro' }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: ${{ matrix.platform.java_distribution || 'temurin' }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Download selected preview Web UI
        if: matrix.web_ui != 'none'
        uses: actions/download-artifact@v8
        with:
          name: preview-web-${{ matrix.web_ui }}-${{ matrix.edition }}
          path: runtime-web-ui

      - name: Select Web UI archive for runtime preview packaging
        if: matrix.web_ui != 'none'
        shell: bash
        run: |
          archives=(runtime-web-ui/*.zip)
          if (( ${#archives[@]} != 1 )) || [[ ! -f "${archives[0]}" ]]; then
            echo "::error::Expected exactly one preview Web UI archive."
            exit 1
          fi
          echo "ORG_GRADLE_PROJECT_runtimeWebUiArchive=${archives[0]}" >> "$GITHUB_ENV"

      - name: Build runtime distribution
        shell: bash
        run: >-
          ./gradlew --no-daemon --max-workers=1 ${{ matrix.platform.tasks }}
          "-Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8"
          "-Pkotlin.daemon.jvmargs=-Xmx2g"
          --stacktrace

      - name: Package Windows ARM64 preview archive
        if: matrix.platform.label == 'windows-arm64'
        shell: pwsh
        run: |
          $version = $env:ORG_GRADLE_PROJECT_releaseVersion
          $webUi = $env:ORG_GRADLE_PROJECT_runtimeWebUi
          $appImage = 'app/headlessRuntime/build/compose/binaries/main-release/app/FolderSpan-Runtime'
          $outputDir = 'app/headlessRuntime/build/compose/binaries/main-release/zip'
          New-Item -ItemType Directory -Force -Path $outputDir | Out-Null
          Compress-Archive -Path $appImage -DestinationPath "$outputDir/FolderSpan-Runtime-$version-$($webUi)-preview-windows-arm64.zip" -Force

      - name: Verify single platform package
        shell: bash
        env:
          PACKAGE_PATH: ${{ matrix.platform.paths }}
        run: |
          shopt -s nullglob
          # shellcheck disable=SC2206
          packages=( $PACKAGE_PATH )
          if (( ${#packages[@]} != 1 )) || [[ ! -f "${packages[0]}" ]]; then
            echo "::error::Expected exactly one platform package; found ${#packages[@]}."
            exit 1
          fi

      - name: Upload Runtime preview packages
        uses: actions/upload-artifact@v7
        with:
          name: preview-headless-runtime-${{ matrix.platform.label }}-${{ matrix.web_ui }}-${{ matrix.edition }}
          path: ${{ matrix.platform.paths }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload runtime preview packaging diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: preview-runtime-packaging-diagnostics-${{ matrix.platform.label }}-${{ matrix.web_ui }}-${{ matrix.edition }}
          path: |
            app/headlessRuntime/build/compose/logs/
            app/headlessRuntime/build/compose/tmp/*.args.txt
          if-no-files-found: warn
          retention-days: 14
