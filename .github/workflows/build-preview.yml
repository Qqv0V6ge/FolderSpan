name: Build Preview

on:
  workflow_dispatch:
    inputs:
      build_android:
        description: "打包 Android"
        type: boolean
        required: true
        default: true
      build_ios:
        description: "打包 iOS"
        type: boolean
        required: true
        default: true
      build_linux_x64:
        description: "打包 Linux x64"
        type: boolean
        required: true
        default: true
      build_linux_arm64:
        description: "打包 Linux ARM64"
        type: boolean
        required: true
        default: true
      build_windows_x64:
        description: "打包 Windows x64"
        type: boolean
        required: true
        default: true
      build_windows_arm64:
        description: "打包 Windows ARM64"
        type: boolean
        required: true
        default: true
      build_macos_x64:
        description: "打包 macOS x64"
        type: boolean
        required: true
        default: true
      build_macos_arm64:
        description: "打包 macOS ARM64"
        type: boolean
        required: true
        default: true
      build_web_js:
        description: "打包 Web JavaScript"
        type: boolean
        required: true
        default: true
      build_web_wasm:
        description: "打包 Web WebAssembly"
        type: boolean
        required: true
        default: true
permissions:
  contents: read

concurrency:
  group: build-preview-${{ github.workflow }}-${{ github.ref }}-${{ inputs.build_android }}${{ inputs.build_ios }}${{ inputs.build_linux_x64 }}${{ inputs.build_linux_arm64 }}${{ inputs.build_windows_x64 }}${{ inputs.build_windows_arm64 }}${{ inputs.build_macos_x64 }}${{ inputs.build_macos_arm64 }}${{ inputs.build_web_js }}${{ inputs.build_web_wasm }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  # Preview numbering only: JDK 17 macOS jpackage rejects an app-version with major 0.
  ORG_GRADLE_PROJECT_releaseVersion: 1.0.${{ github.run_number }}
  ORG_GRADLE_PROJECT_androidVersionCode: ${{ github.run_number }}

jobs:
  targets:
    name: Select package platforms
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      web: ${{ steps.matrix.outputs.web }}
      native: ${{ steps.matrix.outputs.native }}
    steps:
      - uses: actions/checkout@v6
      - name: Select package platforms
        id: matrix
        env:
          BUILD_INPUTS: ${{ toJSON(inputs) }}
          PACKAGE_MATRIX: >-
            {
              "web": [
                {"label": "js", "target": "js"},
                {"label": "wasm", "target": "wasmJs"}
              ],
              "native": [
                {"label": "linux-x64", "os": "ubuntu-24.04", "tasks": ":app:desktopApp:packageTarGz", "paths": "app/desktopApp/build/compose/binaries/main/targz/*.tar.gz"},
                {"label": "linux-arm64", "os": "ubuntu-24.04-arm", "tasks": ":app:desktopApp:packageTarGz", "paths": "app/desktopApp/build/compose/binaries/main/targz/*.tar.gz"},
                {"label": "windows-x64", "os": "windows-2025", "tasks": ":app:desktopApp:packageMsi", "paths": "app/desktopApp/build/compose/binaries/main/msi/*.msi"},
                {"label": "windows-arm64", "os": "windows-11-arm", "tasks": ":app:desktopApp:createDistributable", "paths": "app/desktopApp/build/compose/binaries/main/zip/*.zip", "java_distribution": "microsoft"},
                {"label": "macos-x64", "os": "macos-15-intel", "tasks": ":app:desktopApp:packageDmg", "paths": "app/desktopApp/build/compose/binaries/main/dmg/*.dmg"},
                {"label": "macos-arm64", "os": "macos-15", "tasks": ":app:desktopApp:packageDmg", "paths": "app/desktopApp/build/compose/binaries/main/dmg/*.dmg"}
              ]
            }
        run: python3 scripts/ci/select-build-targets.py >> "$GITHUB_OUTPUT"

  quality:
    needs: targets
    uses: ./.github/workflows/shared-quality.yml
    secrets:
      PROMAIN_REPOSITORY_TOKEN: ${{ secrets.PROMAIN_REPOSITORY_TOKEN }}

  android:
    name: Package Android preview (${{ matrix.edition }})
    needs: quality
    if: (github.event_name != 'workflow_dispatch' || inputs.build_android)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        edition: [pro]
    env:
      ORG_GRADLE_PROJECT_includeProMain: ${{ matrix.edition == 'pro' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          token: ${{ matrix.edition == 'pro' && secrets.PROMAIN_REPOSITORY_TOKEN || github.token }}
          submodules: ${{ matrix.edition == 'pro' }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:androidApp:assembleDebug --stacktrace

      - name: Upload Android preview
        uses: actions/upload-artifact@v7
        with:
          name: preview-android-${{ matrix.edition }}
          path: app/androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  ios:
    needs: quality
    if: (github.event_name != 'workflow_dispatch' || inputs.build_ios)
    uses: ./.github/workflows/apple-store-pro.yml
    with:
      version: ${{ format('1.0.{0}', github.run_number) }}
      build_number: ${{ format('{0}', github.run_number) }}
      ipa_artifact_name: preview-ios-pro
      ipa_retention_days: 14
    secrets:
      PROMAIN_REPOSITORY_TOKEN: ${{ secrets.PROMAIN_REPOSITORY_TOKEN }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_APP_PROFILE_BASE64: ${{ secrets.IOS_APP_PROFILE_BASE64 }}
      IOS_SHARE_PROFILE_BASE64: ${{ secrets.IOS_SHARE_PROFILE_BASE64 }}

  web:
    name: Package Web preview (${{ matrix.platform.label }}, ${{ matrix.edition }})
    needs: [targets, quality]
    if: needs.targets.outputs.web != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        edition: [pro]
        platform: ${{ fromJSON(needs.targets.outputs.web) }}
    env:
      ORG_GRADLE_PROJECT_includeProMain: ${{ matrix.edition == 'pro' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          token: ${{ matrix.edition == 'pro' && secrets.PROMAIN_REPOSITORY_TOKEN || github.token }}
          submodules: ${{ matrix.edition == 'pro' }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Web development distribution
        run: >-
          ./gradlew --no-daemon
          :app:webApp:${{ matrix.platform.target }}BrowserDevelopmentExecutableDistribution
          --stacktrace

      - name: Create Web preview archive
        shell: bash
        run: |
          archive="$GITHUB_WORKSPACE/folderspan-web-${{ matrix.platform.label }}-${{ matrix.edition }}-preview-${GITHUB_SHA:0:7}.zip"
          cd app/webApp/build/dist/${{ matrix.platform.target }}/developmentExecutable
          zip -q -r "$archive" .

      - name: Upload Web preview
        uses: actions/upload-artifact@v7
        with:
          name: preview-web-${{ matrix.platform.label }}-${{ matrix.edition }}
          path: folderspan-web-${{ matrix.platform.label }}-${{ matrix.edition }}-preview-*.zip
          if-no-files-found: error
          retention-days: 14

  desktop:
    name: Package Desktop preview (${{ matrix.platform.label }}, ${{ matrix.edition }})
    needs: [targets, quality]
    if: needs.targets.outputs.native != '[]'
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        edition: [pro]
        platform: ${{ fromJSON(needs.targets.outputs.native) }}
    env:
      ORG_GRADLE_PROJECT_includeProMain: ${{ matrix.edition == 'pro' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          token: ${{ matrix.edition == 'pro' && secrets.PROMAIN_REPOSITORY_TOKEN || github.token }}
          submodules: ${{ matrix.edition == 'pro' }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: ${{ matrix.platform.java_distribution || 'temurin' }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build debug native installers
        shell: bash
        run: >-
          ./gradlew --no-daemon ${{ matrix.platform.tasks }}
          "-Dorg.gradle.jvmargs=-Xmx3g"
          "-Pkotlin.daemon.jvmargs=-Xmx2g"
          --stacktrace

      - name: Package Windows ARM64 preview archive
        if: matrix.platform.label == 'windows-arm64'
        shell: pwsh
        run: |
          $version = $env:ORG_GRADLE_PROJECT_releaseVersion
          $appImage = 'app/desktopApp/build/compose/binaries/main/app/FolderSpan'
          $outputDir = 'app/desktopApp/build/compose/binaries/main/zip'
          New-Item -ItemType Directory -Force -Path $outputDir | Out-Null
          Compress-Archive -Path $appImage -DestinationPath "$outputDir/FolderSpan-$version-preview-windows-arm64.zip" -Force

      - name: Verify single platform package
        shell: bash
        env:
          PACKAGE_PATH: ${{ matrix.platform.paths }}
        run: |
          shopt -s nullglob
          # shellcheck disable=SC2206
          packages=( $PACKAGE_PATH )
          if (( ${#packages[@]} != 1 )) || [[ ! -f "${packages[0]}" ]]; then
            echo "::error::Expected exactly one platform package; found ${#packages[@]}."
            exit 1
          fi

      - name: Upload Desktop preview
        uses: actions/upload-artifact@v7
        with:
          name: preview-desktop-${{ matrix.platform.label }}-${{ matrix.edition }}
          path: ${{ matrix.platform.paths }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload desktop preview packaging diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: preview-desktop-packaging-diagnostics-${{ matrix.platform.label }}-${{ matrix.edition }}
          path: |
            app/desktopApp/build/compose/logs/
            app/desktopApp/build/compose/tmp/*.args.txt
          if-no-files-found: warn
          retention-days: 14
