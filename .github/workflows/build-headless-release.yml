name: Build and Release Headless

on:
  push:
    tags:
      - "headless-v*"
  workflow_dispatch:
    inputs:
      build_linux_x64:
        description: "打包 Linux x64"
        type: boolean
        required: true
        default: true
      build_linux_arm64:
        description: "打包 Linux ARM64"
        type: boolean
        required: true
        default: true
      build_windows_x64:
        description: "打包 Windows x64"
        type: boolean
        required: true
        default: true
      build_windows_arm64:
        description: "打包 Windows ARM64"
        type: boolean
        required: true
        default: true
      build_macos_x64:
        description: "打包 macOS x64"
        type: boolean
        required: true
        default: true
      build_macos_arm64:
        description: "打包 macOS ARM64"
        type: boolean
        required: true
        default: true
      version:
        description: "发布版本（MAJOR.MINOR.PATCH，创建草稿须使用新版本）"
        required: true
        default: ""
        type: string
      create_draft:
        description: "Headless 构建通过后创建独立的草稿 Release"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: build-headless-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  JAVA_VERSION: "17"
  ORG_GRADLE_PROJECT_folderspanBuildType: release

jobs:
  prepare:
    name: Validate release version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      apple_no_pro_build_number: ${{ steps.version.outputs.apple_no_pro_build_number }}
      apple_build_number: ${{ steps.version.outputs.apple_build_number }}
      windows_package_version: ${{ steps.version.outputs.windows_package_version }}
      android_version_code: ${{ steps.version.outputs.android_version_code }}
      source_revision: ${{ steps.version.outputs.source_revision }}
      native: ${{ steps.matrix.outputs.native }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Resolve install versions
        id: version
        env:
          BUILD_PRODUCT: headless
          BUILD_CHANNEL: release
          BUILD_VERSION: ${{ startsWith(github.ref, 'refs/tags/headless-v') && github.ref_name || inputs.version }}
        run: python3 scripts/ci/resolve-install-versions.py >> "$GITHUB_OUTPUT"
      - name: Select package platforms
        id: matrix
        env:
          BUILD_INPUTS: ${{ toJSON(inputs) }}
          PACKAGE_MATRIX: >-
            {
              "native": [
                {"os": "ubuntu-24.04", "label": "linux-x64", "tasks": ":app:headlessRuntime:packageReleaseTarGz", "paths": "app/headlessRuntime/build/compose/binaries/main-release/targz/*.tar.gz"},
                {"os": "ubuntu-24.04-arm", "label": "linux-arm64", "tasks": ":app:headlessRuntime:packageReleaseTarGz", "paths": "app/headlessRuntime/build/compose/binaries/main-release/targz/*.tar.gz"},
                {"os": "windows-2025", "label": "windows-x64", "tasks": ":app:headlessRuntime:packageReleaseMsi", "paths": "app/headlessRuntime/build/compose/binaries/main-release/msi/*.msi"},
                {"os": "windows-11-arm", "label": "windows-arm64", "java_distribution": "microsoft", "tasks": ":app:headlessRuntime:createReleaseDistributable", "paths": "app/headlessRuntime/build/compose/binaries/main-release/zip/*.zip"},
                {"os": "macos-15-intel", "label": "macos-x64", "tasks": ":app:headlessRuntime:packageReleaseDmg :app:headlessRuntime:packageReleasePkg", "paths": "app/headlessRuntime/build/compose/binaries/main-release/dmg/*.dmg\napp/headlessRuntime/build/compose/binaries/main-release/pkg/*.pkg\n"},
                {"os": "macos-15", "label": "macos-arm64", "tasks": ":app:headlessRuntime:packageReleaseDmg :app:headlessRuntime:packageReleasePkg", "paths": "app/headlessRuntime/build/compose/binaries/main-release/dmg/*.dmg\napp/headlessRuntime/build/compose/binaries/main-release/pkg/*.pkg\n"}
              ]
            }
        run: python3 scripts/ci/select-build-targets.py >> "$GITHUB_OUTPUT"

  quality:
    needs: prepare
    uses: ./.github/workflows/shared-quality.yml
    secrets:
      PROMAIN_REPOSITORY_TOKEN: ${{ secrets.PROMAIN_REPOSITORY_TOKEN }}

  web:
    name: Package Web (${{ matrix.platform.label }}, ${{ matrix.edition }})
    needs: [prepare, quality]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        edition: [pro]
        platform:
          - label: js
            target: js
          - label: wasm
            target: wasmJs
    env:
      ORG_GRADLE_PROJECT_releaseVersion: ${{ needs.prepare.outputs.version }}
      ORG_GRADLE_PROJECT_includeProMain: ${{ matrix.edition == 'pro' }}
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          token: ${{ matrix.edition == 'pro' && secrets.PROMAIN_REPOSITORY_TOKEN || github.token }}
          submodules: ${{ matrix.edition == 'pro' }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Web production distribution
        run: >-
          ./gradlew --no-daemon --max-workers=1
          :app:webApp:${{ matrix.platform.target }}BrowserDistribution
          --stacktrace

      - name: Create Web release archive
        shell: bash
        run: |
          archive="$GITHUB_WORKSPACE/folderspan-web-${{ matrix.platform.label }}-${{ matrix.edition }}-${ORG_GRADLE_PROJECT_releaseVersion#v}.zip"
          cd app/webApp/build/dist/${{ matrix.platform.target }}/productionExecutable
          zip -q -r "$archive" .

      - name: Upload Web package
        uses: actions/upload-artifact@v7
        with:
          name: release-web-${{ matrix.platform.label }}-${{ matrix.edition }}
          path: folderspan-web-${{ matrix.platform.label }}-${{ matrix.edition }}-*.zip
          if-no-files-found: error
          retention-days: 30

  headless-runtime:
    name: Package Headless Runtime (${{ matrix.platform.label }}, ${{ matrix.web_ui }}, ${{ matrix.edition }})
    needs: [prepare, quality, web]
    if: needs.prepare.outputs.native != '[]'
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        edition: [pro]
        web_ui: [none, js, wasm]
        platform: ${{ fromJSON(needs.prepare.outputs.native) }}
    env:
      ORG_GRADLE_PROJECT_windowsPackageVersion: ${{ needs.prepare.outputs.windows_package_version }}
      ORG_GRADLE_PROJECT_releaseVersion: ${{ needs.prepare.outputs.version }}
      ORG_GRADLE_PROJECT_includeProMain: ${{ matrix.edition == 'pro' }}
      MACOS_RELEASE_DIR: app/headlessRuntime/build/compose/binaries/main-release
      ORG_GRADLE_PROJECT_runtimeWebUi: ${{ matrix.web_ui }}
      ORG_GRADLE_PROJECT_folderspanBuildType: release
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          token: ${{ matrix.edition == 'pro' && secrets.PROMAIN_REPOSITORY_TOKEN || github.token }}
          submodules: ${{ matrix.edition == 'pro' }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: ${{ matrix.platform.java_distribution || 'temurin' }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Download selected production Web UI
        if: matrix.web_ui != 'none'
        uses: actions/download-artifact@v8
        with:
          name: release-web-${{ matrix.web_ui }}-${{ matrix.edition }}
          path: runtime-web-ui

      - name: Select Web UI archive for runtime packaging
        if: matrix.web_ui != 'none'
        shell: bash
        run: |
          archives=(runtime-web-ui/*.zip)
          if (( ${#archives[@]} != 1 )) || [[ ! -f "${archives[0]}" ]]; then
            echo "::error::Expected exactly one production Web UI archive."
            exit 1
          fi
          echo "ORG_GRADLE_PROJECT_runtimeWebUiArchive=${archives[0]}" >> "$GITHUB_ENV"

      - name: Build runtime distribution
        if: runner.os != 'macOS'
        shell: bash
        run: >-
          ./gradlew --no-daemon --max-workers=1 ${{ matrix.platform.tasks }}
          "-Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8"
          "-Pkotlin.daemon.jvmargs=-Xmx2g"
          --stacktrace

      - name: Import Developer ID certificates
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.MACOS_DIRECT_CERTIFICATES_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_DIRECT_CERTIFICATES_PASSWORD }}
        run: bash scripts/ci/apple-keychain.sh setup

      - name: Build Developer ID signed runtime packages
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          identity="$(bash scripts/ci/apple-keychain.sh developer-id-identity)"
          ./gradlew --no-daemon --max-workers=1 ${{ matrix.platform.tasks }} \
            "-Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8" "-Pkotlin.daemon.jvmargs=-Xmx2g" --stacktrace \
            -Pcompose.desktop.mac.sign=true "-Pcompose.desktop.mac.signing.identity=$identity" \
            "-Pcompose.desktop.mac.signing.keychain=$APPLE_KEYCHAIN"
          codesign --verify --deep --strict "$MACOS_RELEASE_DIR/app/FolderSpan-Runtime.app"
          shopt -s nullglob
          dmgs=("$MACOS_RELEASE_DIR"/dmg/*.dmg)
          if (( ${#dmgs[@]} != 1 )); then
            echo "::error::Expected exactly one macOS runtime DMG."
            exit 1
          fi
          codesign --force --timestamp --identifier com.folderspan.runtime.dmg \
            --sign "Developer ID Application: $identity" --keychain "$APPLE_KEYCHAIN" "${dmgs[0]}"

      - name: Notarize and staple runtime DMG and PKG
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/ci/notarize-macos.sh "$MACOS_RELEASE_DIR"

      - name: Clean up Developer ID keychain
        if: always() && runner.os == 'macOS'
        shell: bash
        run: bash scripts/ci/apple-keychain.sh cleanup

      - name: Package Windows ARM64 archive
        if: matrix.platform.label == 'windows-arm64'
        shell: pwsh
        run: |
          $version = $env:ORG_GRADLE_PROJECT_releaseVersion -replace '^v', ''
          $webUi = $env:ORG_GRADLE_PROJECT_runtimeWebUi
          $appImage = 'app/headlessRuntime/build/compose/binaries/main-release/app/FolderSpan-Runtime'
          $outputDir = 'app/headlessRuntime/build/compose/binaries/main-release/zip'
          New-Item -ItemType Directory -Force -Path $outputDir | Out-Null
          Compress-Archive -Path $appImage -DestinationPath "$outputDir/FolderSpan-Runtime-$version-$($webUi)-windows-arm64.zip" -Force

      - name: Verify single platform package
        if: runner.os != 'macOS'
        shell: bash
        env:
          PACKAGE_PATH: ${{ matrix.platform.paths }}
        run: |
          shopt -s nullglob
          # shellcheck disable=SC2206
          packages=( $PACKAGE_PATH )
          if (( ${#packages[@]} != 1 )) || [[ ! -f "${packages[0]}" ]]; then
            echo "::error::Expected exactly one platform package; found ${#packages[@]}."
            exit 1
          fi

      - name: Upload Runtime packages
        uses: actions/upload-artifact@v7
        with:
          name: release-headless-runtime-${{ matrix.platform.label }}-${{ matrix.web_ui }}-${{ matrix.edition }}
          path: ${{ matrix.platform.paths }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload runtime packaging diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: runtime-packaging-diagnostics-${{ matrix.platform.label }}-${{ matrix.web_ui }}-${{ matrix.edition }}
          path: |
            app/headlessRuntime/build/compose/logs/
            app/headlessRuntime/build/compose/tmp/*.args.txt
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Prepare draft Headless GitHub Release
    needs:
      - prepare
      - web
      - headless-runtime
    if: >-
      (startsWith(github.ref, 'refs/tags/headless-v') || inputs.create_draft) &&
      needs.web.result == 'success' &&
      needs.headless-runtime.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: Check out release commit and tags
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify existing tag targets this build
        shell: bash
        run: |
          if tag_commit=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}" 2>/dev/null); then
            if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
              echo "::error::Existing release tag points to another commit. Choose a new version."
              exit 1
            fi
          fi

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: artifacts

      - name: Prepare release assets and checksums
        shell: bash
        run: |
          mkdir -p release-assets
          asset_count=0
          while IFS= read -r -d '' source; do
            relative="${source#artifacts/}"
            artifact_name="${relative%%/*}"
            file_name="$(basename "$source")"
            cp "$source" "release-assets/${artifact_name#release-}-$file_name"
            ((asset_count += 1))
          done < <(find artifacts -type f -print0)

          if (( asset_count == 0 )); then
            echo "::error::No release assets were downloaded."
            exit 1
          fi

          cd release-assets
          sha256sum ./* > SHA256SUMS.txt

      - name: Create or update draft GitHub Release
        shell: bash
        run: |
          if release_info=$(gh release view "$RELEASE_TAG" --json isDraft,targetCommitish --jq '[.isDraft, .targetCommitish] | @tsv' 2>/dev/null); then
            read -r is_draft target_commit <<< "$release_info"
            if [[ "$is_draft" != "true" ]]; then
              echo "::error::Refusing to overwrite an already published release."
              exit 1
            fi
            if ! git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}" >/dev/null 2>&1 &&
              [[ "$target_commit" != "$GITHUB_SHA" ]]; then
              echo "::error::Existing draft belongs to another commit. Choose a new version or rerun that commit."
              exit 1
            fi
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --draft --latest=false --target "$GITHUB_SHA" \
              --title "FolderSpan Headless ${RELEASE_TAG#headless-v}" \
              --generate-notes
          fi
          gh release view "$RELEASE_TAG" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
