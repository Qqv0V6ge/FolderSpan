name: Test Shared Code

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: JVM tests (${{ matrix.edition }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        edition: [pro, no-pro]
    env:
      ORG_GRADLE_PROJECT_includeProMain: ${{ matrix.edition == 'pro' }}
      ORG_GRADLE_PROJECT_folderspanBuildType: release
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install desktop test runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            xvfb xauth libasound2t64 libpulse0 libudev1 libdbus-1-3 \
            libx11-6 libxext6 libxfixes3 libxdamage1 libxtst6 \
            libxrandr2 libxcomposite1 libglib2.0-0t64 libgbm1 libdrm2 libgl1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run JVM tests with a virtual display
        shell: bash
        run: |
          tasks=(:core:jvmTest :app:shared:jvmTest :core:verifyNotificationRoutes)
          if [[ "$ORG_GRADLE_PROJECT_includeProMain" == "true" ]]; then
            tasks+=(:proMain:jvmTest)
          fi
          xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" \
            ./gradlew --no-daemon --max-workers=2 \
            -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8" \
            -Pkotlin.daemon.jvmargs=-Xmx2g \
            "${tasks[@]}" --stacktrace

      - name: Upload JVM test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.edition }}
          path: |
            core/build/reports/tests/jvmTest/
            core/build/test-results/jvmTest/
            app/shared/build/reports/tests/jvmTest/
            app/shared/build/test-results/jvmTest/
            proMain/build/reports/tests/jvmTest/
            proMain/build/test-results/jvmTest/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload notification route catalog
        uses: actions/upload-artifact@v7
        with:
          name: notification-routes-${{ matrix.edition }}
          path: notification-routes.json
          if-no-files-found: error
          retention-days: 14
