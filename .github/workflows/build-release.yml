name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本（MAJOR.MINOR.PATCH）"
        required: true
        default: "1.0.0"
        type: string
      create_draft:
        description: "全部构建通过后创建草稿 Release"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: build-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  JAVA_VERSION: "17"
  ORG_GRADLE_PROJECT_folderspanBuildType: release
  ORG_GRADLE_PROJECT_releaseVersion: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.version || '1.0.0' }}
  ORG_GRADLE_PROJECT_androidVersionCode: ${{ github.run_number }}

jobs:
  prepare:
    name: Validate release version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Validate version
        id: version
        shell: bash
        run: |
          version="${ORG_GRADLE_PROJECT_releaseVersion#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release version must use MAJOR.MINOR.PATCH format."
            exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  quality:
    needs: prepare
    uses: ./.github/workflows/shared-quality.yml
    secrets:
      PROMAIN_REPOSITORY_TOKEN: ${{ secrets.PROMAIN_REPOSITORY_TOKEN }}

  android:
    name: Package Android (${{ matrix.edition }})
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        edition: [pro, no-pro]
    env:
      ORG_GRADLE_PROJECT_includeProMain: ${{ matrix.edition == 'pro' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          token: ${{ matrix.edition == 'pro' && secrets.PROMAIN_REPOSITORY_TOKEN || github.token }}
          submodules: ${{ matrix.edition == 'pro' }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Validate and restore Android release signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=()
          [[ -z "$ANDROID_KEYSTORE_BASE64" ]] && missing+=("ANDROID_KEYSTORE_BASE64")
          [[ -z "$ANDROID_STORE_PASSWORD" ]] && missing+=("ANDROID_STORE_PASSWORD")
          [[ -z "$ANDROID_KEY_ALIAS" ]] && missing+=("ANDROID_KEY_ALIAS")
          [[ -z "$ANDROID_KEY_PASSWORD" ]] && missing+=("ANDROID_KEY_PASSWORD")
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing Android signing secrets: ${missing[*]}"
            exit 1
          fi

          keystore_path="$RUNNER_TEMP/folderspan-release.keystore"
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          echo "ANDROID_STORE_FILE=$keystore_path" >> "$GITHUB_ENV"

      - name: Build signed release AAB
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >-
          ./gradlew --no-daemon :app:androidApp:bundleRelease
          -PandroidEnableAbiSplits=false
          --stacktrace

      - name: Stage release AAB
        shell: bash
        run: |
          mkdir -p release-artifacts/android
          cp app/androidApp/build/outputs/bundle/release/*.aab release-artifacts/android/

      - name: Build signed release APKs
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:androidApp:clean :app:androidApp:assembleRelease --stacktrace

      - name: Stage release APKs
        shell: bash
        run: cp app/androidApp/build/outputs/apk/release/*.apk release-artifacts/android/

      - name: Upload Android release packages
        uses: actions/upload-artifact@v7
        with:
          name: release-android-${{ matrix.edition }}
          path: release-artifacts/android/*
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary Android keystore
        if: always()
        shell: bash
        run: |
          if [[ -n "${ANDROID_STORE_FILE:-}" ]]; then
            rm -f -- "$ANDROID_STORE_FILE"
          fi

  ios:
    needs: [prepare, quality]
    strategy:
      fail-fast: false
      matrix:
        edition: [pro, no-pro]
    uses: ./.github/workflows/apple-store-pro.yml
    with:
      edition: ${{ matrix.edition }}
      version: ${{ needs.prepare.outputs.version }}
      build_number: ${{ matrix.edition == 'pro' && format('{0}', github.run_number) || format('{0}.1', github.run_number) }}
      ipa_artifact_name: release-ios-${{ matrix.edition }}
      ipa_retention_days: 30
    secrets:
      PROMAIN_REPOSITORY_TOKEN: ${{ secrets.PROMAIN_REPOSITORY_TOKEN }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_APP_PROFILE_BASE64: ${{ secrets.IOS_APP_PROFILE_BASE64 }}
      IOS_SHARE_PROFILE_BASE64: ${{ secrets.IOS_SHARE_PROFILE_BASE64 }}

  web:
    name: Package Web (${{ matrix.platform.label }}, ${{ matrix.edition }})
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        edition: [pro, no-pro]
        platform:
          - label: js
            target: js
          - label: wasm
            target: wasmJs
    env:
      ORG_GRADLE_PROJECT_includeProMain: ${{ matrix.edition == 'pro' }}
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          token: ${{ matrix.edition == 'pro' && secrets.PROMAIN_REPOSITORY_TOKEN || github.token }}
          submodules: ${{ matrix.edition == 'pro' }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Web production distribution
        run: >-
          ./gradlew --no-daemon --max-workers=1
          :app:webApp:${{ matrix.platform.target }}BrowserDistribution
          --stacktrace

      - name: Create Web release archive
        shell: bash
        run: |
          archive="$GITHUB_WORKSPACE/folderspan-web-${{ matrix.platform.label }}-${{ matrix.edition }}-${ORG_GRADLE_PROJECT_releaseVersion#v}.zip"
          cd app/webApp/build/dist/${{ matrix.platform.target }}/productionExecutable
          zip -q -r "$archive" .

      - name: Upload Web package
        uses: actions/upload-artifact@v7
        with:
          name: release-web-${{ matrix.platform.label }}-${{ matrix.edition }}
          path: folderspan-web-${{ matrix.platform.label }}-${{ matrix.edition }}-*.zip
          if-no-files-found: error
          retention-days: 30

  desktop:
    name: Package Desktop (${{ matrix.platform.label }}, ${{ matrix.edition }})
    needs: quality
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        edition: [pro, no-pro]
        platform:
          - os: ubuntu-24.04
            label: linux-x64
            tasks: :app:desktopApp:packageReleaseDistributionForCurrentOS :app:desktopApp:packageReleaseTarGz
            paths: |
              app/desktopApp/build/compose/binaries/main-release/deb/*.deb
              app/desktopApp/build/compose/binaries/main-release/rpm/*.rpm
              app/desktopApp/build/compose/binaries/main-release/targz/*.tar.gz
              app/desktopApp/build/compose/binaries/main-release/flatpak/*.flatpak
          - os: ubuntu-24.04-arm
            label: linux-arm64
            tasks: :app:desktopApp:packageReleaseDistributionForCurrentOS :app:desktopApp:packageReleaseTarGz
            paths: |
              app/desktopApp/build/compose/binaries/main-release/deb/*.deb
              app/desktopApp/build/compose/binaries/main-release/rpm/*.rpm
              app/desktopApp/build/compose/binaries/main-release/targz/*.tar.gz
              app/desktopApp/build/compose/binaries/main-release/flatpak/*.flatpak
          - os: windows-2025
            label: windows-x64
            tasks: :app:desktopApp:packageReleaseDistributionForCurrentOS
            paths: |
              app/desktopApp/build/compose/binaries/main-release/msi/*.msi
              app/desktopApp/build/compose/binaries/main-release/exe/*.exe
          - os: windows-11-arm
            label: windows-arm64
            java_distribution: microsoft
            tasks: :app:desktopApp:createReleaseDistributable
            paths: app/desktopApp/build/compose/binaries/main-release/zip/*.zip
          - os: macos-15-intel
            label: macos-x64
            tasks: :app:desktopApp:packageReleaseDistributionForCurrentOS
            paths: |
              app/desktopApp/build/compose/binaries/main-release/dmg/*.dmg
              app/desktopApp/build/compose/binaries/main-release/pkg/*.pkg
          - os: macos-15
            label: macos-arm64
            tasks: :app:desktopApp:packageReleaseDistributionForCurrentOS
            paths: |
              app/desktopApp/build/compose/binaries/main-release/dmg/*.dmg
              app/desktopApp/build/compose/binaries/main-release/pkg/*.pkg
    env:
      PACKAGE_EDITION: ${{ matrix.edition }}
      ORG_GRADLE_PROJECT_includeProMain: ${{ matrix.edition == 'pro' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          token: ${{ matrix.edition == 'pro' && secrets.PROMAIN_REPOSITORY_TOKEN || github.token }}
          submodules: ${{ matrix.edition == 'pro' }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: ${{ matrix.platform.java_distribution || 'temurin' }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          packages=(
            appstream
            desktop-file-utils
            flatpak
            flatpak-builder
            fakeroot
            rpm
          )
          sudo apt-get install --yes "${packages[@]}"

      - name: Install Flatpak SDK
        if: runner.os == 'Linux'
        shell: bash
        run: |
          flatpak remote-add --user --if-not-exists \
            flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub \
            org.freedesktop.Platform//25.08 \
            org.freedesktop.Sdk//25.08

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build native installers
        shell: bash
        run: >-
          ./gradlew --no-daemon ${{ matrix.platform.tasks }}
          "-Dorg.gradle.jvmargs=-Xmx3g"
          "-Pkotlin.daemon.jvmargs=-Xmx2g"
          --stacktrace

      - name: Build Flatpak bundle
        if: runner.os == 'Linux'
        shell: bash
        run: |
          version="${ORG_GRADLE_PROJECT_releaseVersion#v}"
          release_date="$(date -u +%F)"
          metainfo="packaging/flatpak/com.folderspan.FolderSpan.metainfo.xml"
          manifest="packaging/flatpak/com.folderspan.FolderSpan.yml"
          # The public metadata describes no-pro; retain Pro's previous license scope.
          if [[ "$ORG_GRADLE_PROJECT_includeProMain" == "true" ]]; then
            sed -i -E \
              's#<project_license>[^<]+</project_license>#<project_license>LicenseRef-proprietary</project_license>#' \
              "$metainfo"
          fi
          sed -i -E \
            's#<release version="[^"]+" date="[^"]+" */>#<release version="'"$version"'" date="'"$release_date"'" />#' \
            "$metainfo"

          desktop-file-validate \
            packaging/flatpak/com.folderspan.FolderSpan.desktop
          appstreamcli validate --no-net "$metainfo"

          flatpak_builder_dir="$RUNNER_TEMP/folderspan-flatpak-build"
          flatpak_repo_dir="$RUNNER_TEMP/folderspan-flatpak-repo"
          flatpak_output_dir="app/desktopApp/build/compose/binaries/main-release/flatpak"
          mkdir -p "$flatpak_output_dir"

          flatpak-builder --user --force-clean \
            --repo="$flatpak_repo_dir" \
            "$flatpak_builder_dir" \
            "$manifest"

          flatpak_arch="$(flatpak --default-arch)"
          flatpak build-bundle \
            --arch="$flatpak_arch" \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            "$flatpak_repo_dir" \
            "$flatpak_output_dir/FolderSpan-${version}-${flatpak_arch}.flatpak" \
            com.folderspan.FolderSpan

      - name: Package Windows ARM64 portable archive
        if: matrix.platform.label == 'windows-arm64'
        shell: pwsh
        run: |
          $version = $env:ORG_GRADLE_PROJECT_releaseVersion -replace '^v', ''
          $appImage = 'app/desktopApp/build/compose/binaries/main-release/app/FolderSpan'
          $outputDir = 'app/desktopApp/build/compose/binaries/main-release/zip'
          New-Item -ItemType Directory -Force -Path $outputDir | Out-Null
          Compress-Archive -Path $appImage -DestinationPath "$outputDir/FolderSpan-$version-windows-arm64.zip" -Force

      - name: Verify desktop package formats
        shell: bash
        env:
          PACKAGE_PATHS: ${{ matrix.platform.paths }}
        run: |
          shopt -s nullglob
          while IFS= read -r pattern; do
            [[ -n "$pattern" ]] || continue
            # shellcheck disable=SC2206
            packages=( $pattern )
            if (( ${#packages[@]} != 1 )) || [[ ! -s "${packages[0]}" ]]; then
              echo "::error::Expected exactly one non-empty package matching $pattern."
              exit 1
            fi
          done <<< "$PACKAGE_PATHS"

      - name: Upload Desktop packages
        uses: actions/upload-artifact@v7
        with:
          name: release-desktop-${{ matrix.platform.label }}-${{ matrix.edition }}
          path: ${{ matrix.platform.paths }}
          if-no-files-found: error
          retention-days: 30

      - name: Build AppImage
        if: matrix.platform.label == 'linux-x64'
        shell: bash
        run: bash scripts/ci/package-release-appimage.sh "$PACKAGE_EDITION" "${ORG_GRADLE_PROJECT_releaseVersion#v}"

      - name: Prepare strict Snap from the app image
        if: matrix.platform.label == 'linux-x64'
        shell: bash
        run: |
          project=build/release-snap
          mkdir -p "$project/local/application"
          cp -a app/desktopApp/build/compose/binaries/main-release/app/FolderSpan/. "$project/local/application/"
          cp packaging/linux/folderspan.desktop "$project/local/"
          version="${ORG_GRADLE_PROJECT_releaseVersion#v}"
          sed -E \
            -e "s/^version:.*/version: '$version'/" \
            -e 's#^    source:.*#    source: local/application#' \
            -e '/^    source-checksum:/d' \
            -e '/^    build-packages:/,/^    stage-packages:/{ /^    stage-packages:/!d; }' \
            packaging/snap/snapcraft.yaml > "$project/snapcraft.yaml"
          if [[ "$PACKAGE_EDITION" == pro ]]; then
            sed -E \
              -e 's/^name: folderspan$/name: folderspan-pro/' \
              -e 's/^  folderspan:$/  folderspan-pro:/' \
              -e 's/^license:.*/license: Proprietary/' \
              -e 's/^  FolderSpan standard edition.*/  FolderSpan Pro adds account sync and official online services./' \
              -e '/^  Its own source code is Apache-2.0/,/^  respective licenses/d' \
              "$project/snapcraft.yaml" > "$project/snapcraft.yaml.pro"
            mv "$project/snapcraft.yaml.pro" "$project/snapcraft.yaml"
            sed 's/^Name=FolderSpan$/Name=FolderSpan Pro/' packaging/linux/folderspan.desktop > "$project/local/folderspan.desktop"
          fi

      - name: Build strict Snap
        if: matrix.platform.label == 'linux-x64'
        uses: snapcore/action-build@v1
        id: snap
        with:
          path: build/release-snap

      - name: Stage Linux channel packages
        if: matrix.platform.label == 'linux-x64'
        shell: bash
        env:
          SNAP_PACKAGE: ${{ steps.snap.outputs.snap }}
        run: |
          version="${ORG_GRADLE_PROJECT_releaseVersion#v}"
          name=folderspan
          if [[ "$PACKAGE_EDITION" == pro ]]; then
            name=folderspan-pro
          fi
          cp "$SNAP_PACKAGE" "release-artifacts/linux-channel/$name-$version-amd64-candidate.snap"

      - name: Upload Linux channel packages
        if: matrix.platform.label == 'linux-x64'
        uses: actions/upload-artifact@v7
        with:
          name: release-linux-channel-${{ matrix.edition }}
          path: release-artifacts/linux-channel/
          if-no-files-found: error
          retention-days: 30

      - name: Build Chocolatey wrapper
        if: matrix.platform.label == 'windows-x64'
        shell: pwsh
        run: |
          $version = $env:ORG_GRADLE_PROJECT_releaseVersion -replace '^v', ''
          $msi = @(Get-ChildItem app/desktopApp/build/compose/binaries/main-release/msi/*.msi)
          if ($msi.Count -ne 1) { throw 'Expected exactly one MSI.' }
          python scripts/ci/prepare-release-channel-recipes.py chocolatey $version $env:PACKAGE_EDITION ($msi[0].FullName) build/release-chocolatey
          if ($LASTEXITCODE -ne 0) { throw 'Preparing Chocolatey recipes failed.' }
          New-Item -ItemType Directory -Force -Path release-artifacts/chocolatey | Out-Null
          choco pack build/release-chocolatey/folderspan.nuspec --output-directory release-artifacts/chocolatey
          if ($LASTEXITCODE -ne 0) { throw 'Chocolatey packaging failed.' }

      - name: Upload Chocolatey package
        if: matrix.platform.label == 'windows-x64'
        uses: actions/upload-artifact@v7
        with:
          name: release-chocolatey-${{ matrix.edition }}
          path: release-artifacts/chocolatey/*.nupkg
          if-no-files-found: error
          retention-days: 30

  release:
    name: Prepare draft GitHub Release
    needs:
      - prepare
      - android
      - ios
      - web
      - desktop
    if: >-
      (startsWith(github.ref, 'refs/tags/v') || inputs.create_draft) &&
      needs.android.result == 'success' &&
      needs.ios.result == 'success' &&
      needs.web.result == 'success' &&
      needs.desktop.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: Check out release commit and tags
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify existing tag targets this build
        shell: bash
        run: |
          if tag_commit=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}" 2>/dev/null); then
            if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
              echo "::error::Existing release tag points to another commit. Choose a new version."
              exit 1
            fi
          fi

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: artifacts

      - name: Install MSI metadata reader
        run: |
          sudo apt-get update
          sudo apt-get install --yes msitools

      - name: Generate channel recipes from built packages
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p artifacts/release-channel-recipes
          python3 scripts/ci/prepare-release-channel-recipes.py recipes \
            "$RELEASE_VERSION" "$GITHUB_SHA" "$ORG_GRADLE_PROJECT_androidVersionCode" \
            artifacts artifacts/release-channel-recipes

      - name: Prepare release assets and checksums
        shell: bash
        run: |
          shopt -s nullglob
          for edition in pro no-pro; do
            ipa_files=(artifacts/release-ios-"$edition"/*.ipa)
            if (( ${#ipa_files[@]} != 1 )) || [[ ! -s "${ipa_files[0]}" ]]; then
              echo "::error::Expected exactly one signed iOS IPA for $edition."
              exit 1
            fi
          done

          mkdir -p release-assets
          asset_count=0
          while IFS= read -r -d '' source; do
            relative="${source#artifacts/}"
            artifact_name="${relative%%/*}"
            file_name="$(basename "$source")"
            case "$artifact_name" in
              release-linux-channel-*|release-chocolatey-*|release-channel-recipes)
                destination="release-assets/$file_name"
                ;;
              *)
                destination="release-assets/${artifact_name#release-}-$file_name"
                ;;
            esac
            if [[ -e "$destination" ]]; then
              echo "::error::Duplicate release asset name: $destination"
              exit 1
            fi
            cp "$source" "$destination"
            ((asset_count += 1))
          done < <(find artifacts -type f -print0)

          if (( asset_count == 0 )); then
            echo "::error::No release assets were downloaded."
            exit 1
          fi

          cd release-assets
          sha256sum ./* > SHA256SUMS.txt

      - name: Create or update draft GitHub Release
        shell: bash
        run: |
          if release_info=$(gh release view "$RELEASE_TAG" --json isDraft,targetCommitish --jq '[.isDraft, .targetCommitish] | @tsv' 2>/dev/null); then
            read -r is_draft target_commit <<< "$release_info"
            if [[ "$is_draft" != "true" ]]; then
              echo "::error::Refusing to overwrite an already published release."
              exit 1
            fi
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
            # An unpublished draft can be rebuilt from a newer commit before its tag exists.
            if ! git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}" >/dev/null 2>&1 &&
              [[ "$target_commit" != "$GITHUB_SHA" ]]; then
              gh release edit "$RELEASE_TAG" --target "$GITHUB_SHA"
            fi
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --draft --target "$GITHUB_SHA" \
              --title "FolderSpan ${RELEASE_TAG#v}" \
              --generate-notes
          fi
          gh release view "$RELEASE_TAG" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
