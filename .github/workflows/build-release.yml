name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本（MAJOR.MINOR.PATCH）"
        required: true
        default: "1.0.0"
        type: string
      create_draft:
        description: "全部构建通过后创建草稿 Release"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: build-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  JAVA_VERSION: "17"
  ORG_GRADLE_PROJECT_folderspanBuildType: release
  ORG_GRADLE_PROJECT_releaseVersion: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.version || '1.0.0' }}
  ORG_GRADLE_PROJECT_androidVersionCode: ${{ github.run_number }}

jobs:
  prepare:
    name: Validate release version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Validate version
        id: version
        shell: bash
        run: |
          version="${ORG_GRADLE_PROJECT_releaseVersion#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release version must use MAJOR.MINOR.PATCH format."
            exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  quality:
    needs: prepare
    uses: ./.github/workflows/shared-quality.yml
    secrets:
      PROMAIN_REPOSITORY_TOKEN: ${{ secrets.PROMAIN_REPOSITORY_TOKEN }}

  android:
    name: Package Android (${{ matrix.edition }})
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        edition: [pro]
    env:
      ORG_GRADLE_PROJECT_includeProMain: ${{ matrix.edition == 'pro' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          token: ${{ matrix.edition == 'pro' && secrets.PROMAIN_REPOSITORY_TOKEN || github.token }}
          submodules: ${{ matrix.edition == 'pro' }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Validate and restore Android release signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=()
          [[ -z "$ANDROID_KEYSTORE_BASE64" ]] && missing+=("ANDROID_KEYSTORE_BASE64")
          [[ -z "$ANDROID_STORE_PASSWORD" ]] && missing+=("ANDROID_STORE_PASSWORD")
          [[ -z "$ANDROID_KEY_ALIAS" ]] && missing+=("ANDROID_KEY_ALIAS")
          [[ -z "$ANDROID_KEY_PASSWORD" ]] && missing+=("ANDROID_KEY_PASSWORD")
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing Android signing secrets: ${missing[*]}"
            exit 1
          fi

          keystore_path="$RUNNER_TEMP/folderspan-release.keystore"
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          echo "ANDROID_STORE_FILE=$keystore_path" >> "$GITHUB_ENV"

      - name: Build signed release APKs
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:androidApp:assembleRelease --stacktrace

      - name: Stage release APKs
        shell: bash
        run: |
          mkdir -p release-artifacts/android
          cp app/androidApp/build/outputs/apk/release/*.apk release-artifacts/android/

      - name: Upload Android release packages
        uses: actions/upload-artifact@v7
        with:
          name: release-android-${{ matrix.edition }}
          path: release-artifacts/android/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary Android keystore
        if: always()
        shell: bash
        run: |
          if [[ -n "${ANDROID_STORE_FILE:-}" ]]; then
            rm -f -- "$ANDROID_STORE_FILE"
          fi

  ios:
    needs: [prepare, quality]
    uses: ./.github/workflows/apple-store-pro.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      build_number: ${{ format('{0}', github.run_number) }}
      ipa_artifact_name: release-ios-pro
      ipa_retention_days: 30
    secrets:
      PROMAIN_REPOSITORY_TOKEN: ${{ secrets.PROMAIN_REPOSITORY_TOKEN }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_APP_PROFILE_BASE64: ${{ secrets.IOS_APP_PROFILE_BASE64 }}
      IOS_SHARE_PROFILE_BASE64: ${{ secrets.IOS_SHARE_PROFILE_BASE64 }}

  web:
    name: Package Web (${{ matrix.platform.label }}, ${{ matrix.edition }})
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        edition: [pro]
        platform:
          - label: js
            target: js
          - label: wasm
            target: wasmJs
    env:
      ORG_GRADLE_PROJECT_includeProMain: ${{ matrix.edition == 'pro' }}
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          token: ${{ matrix.edition == 'pro' && secrets.PROMAIN_REPOSITORY_TOKEN || github.token }}
          submodules: ${{ matrix.edition == 'pro' }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Web production distribution
        run: >-
          ./gradlew --no-daemon --max-workers=1
          :app:webApp:${{ matrix.platform.target }}BrowserDistribution
          --stacktrace

      - name: Create Web release archive
        shell: bash
        run: |
          archive="$GITHUB_WORKSPACE/folderspan-web-${{ matrix.platform.label }}-${{ matrix.edition }}-${ORG_GRADLE_PROJECT_releaseVersion#v}.zip"
          cd app/webApp/build/dist/${{ matrix.platform.target }}/productionExecutable
          zip -q -r "$archive" .

      - name: Upload Web package
        uses: actions/upload-artifact@v7
        with:
          name: release-web-${{ matrix.platform.label }}-${{ matrix.edition }}
          path: folderspan-web-${{ matrix.platform.label }}-${{ matrix.edition }}-*.zip
          if-no-files-found: error
          retention-days: 30

  desktop:
    name: Package Desktop (${{ matrix.platform.label }}, ${{ matrix.edition }})
    needs: quality
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        edition: [pro]
        platform:
          - os: ubuntu-24.04
            label: linux-x64
            tasks: :app:desktopApp:packageReleaseTarGz
            paths: app/desktopApp/build/compose/binaries/main-release/targz/*.tar.gz
          - os: ubuntu-24.04-arm
            label: linux-arm64
            tasks: :app:desktopApp:packageReleaseTarGz
            paths: app/desktopApp/build/compose/binaries/main-release/targz/*.tar.gz
          - os: windows-2025
            label: windows-x64
            tasks: :app:desktopApp:packageReleaseMsi
            paths: app/desktopApp/build/compose/binaries/main-release/msi/*.msi
          - os: windows-11-arm
            label: windows-arm64
            java_distribution: microsoft
            tasks: :app:desktopApp:createReleaseDistributable
            paths: app/desktopApp/build/compose/binaries/main-release/zip/*.zip
          - os: macos-15-intel
            label: macos-x64
            tasks: :app:desktopApp:packageReleaseDmg
            paths: app/desktopApp/build/compose/binaries/main-release/dmg/*.dmg
          - os: macos-15
            label: macos-arm64
            tasks: :app:desktopApp:packageReleaseDmg
            paths: app/desktopApp/build/compose/binaries/main-release/dmg/*.dmg
    env:
      ORG_GRADLE_PROJECT_includeProMain: ${{ matrix.edition == 'pro' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          token: ${{ matrix.edition == 'pro' && secrets.PROMAIN_REPOSITORY_TOKEN || github.token }}
          submodules: ${{ matrix.edition == 'pro' }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: ${{ matrix.platform.java_distribution || 'temurin' }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build native installers
        shell: bash
        run: >-
          ./gradlew --no-daemon ${{ matrix.platform.tasks }}
          "-Dorg.gradle.jvmargs=-Xmx3g"
          "-Pkotlin.daemon.jvmargs=-Xmx2g"
          --stacktrace

      - name: Package Windows ARM64 portable archive
        if: matrix.platform.label == 'windows-arm64'
        shell: pwsh
        run: |
          $version = $env:ORG_GRADLE_PROJECT_releaseVersion -replace '^v', ''
          $appImage = 'app/desktopApp/build/compose/binaries/main-release/app/FolderSpan'
          $outputDir = 'app/desktopApp/build/compose/binaries/main-release/zip'
          New-Item -ItemType Directory -Force -Path $outputDir | Out-Null
          Compress-Archive -Path $appImage -DestinationPath "$outputDir/FolderSpan-$version-windows-arm64.zip" -Force

      - name: Verify single platform package
        shell: bash
        env:
          PACKAGE_PATH: ${{ matrix.platform.paths }}
        run: |
          shopt -s nullglob
          # shellcheck disable=SC2206
          packages=( $PACKAGE_PATH )
          if (( ${#packages[@]} != 1 )) || [[ ! -f "${packages[0]}" ]]; then
            echo "::error::Expected exactly one platform package; found ${#packages[@]}."
            exit 1
          fi

      - name: Upload Desktop packages
        uses: actions/upload-artifact@v7
        with:
          name: release-desktop-${{ matrix.platform.label }}-${{ matrix.edition }}
          path: ${{ matrix.platform.paths }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: Prepare draft GitHub Release
    needs:
      - prepare
      - android
      - ios
      - web
      - desktop
    if: >-
      (startsWith(github.ref, 'refs/tags/v') || inputs.create_draft) &&
      needs.android.result == 'success' &&
      needs.ios.result == 'success' &&
      needs.web.result == 'success' &&
      needs.desktop.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: Check out release commit and tags
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify existing tag targets this build
        shell: bash
        run: |
          if tag_commit=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}" 2>/dev/null); then
            if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
              echo "::error::Existing release tag points to another commit. Choose a new version."
              exit 1
            fi
          fi

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: artifacts

      - name: Prepare release assets and checksums
        shell: bash
        run: |
          shopt -s nullglob
          ipa_files=(artifacts/release-ios-pro/*.ipa)
          if (( ${#ipa_files[@]} != 1 )) || [[ ! -f "${ipa_files[0]}" ]]; then
            echo "::error::Expected exactly one signed iOS IPA."
            exit 1
          fi

          mkdir -p release-assets
          asset_count=0
          while IFS= read -r -d '' source; do
            relative="${source#artifacts/}"
            artifact_name="${relative%%/*}"
            file_name="$(basename "$source")"
            cp "$source" "release-assets/${artifact_name#release-}-$file_name"
            ((asset_count += 1))
          done < <(find artifacts -type f -print0)

          if (( asset_count == 0 )); then
            echo "::error::No release assets were downloaded."
            exit 1
          fi

          cd release-assets
          sha256sum ./* > SHA256SUMS.txt

      - name: Create or update draft GitHub Release
        shell: bash
        run: |
          if release_info=$(gh release view "$RELEASE_TAG" --json isDraft,targetCommitish --jq '[.isDraft, .targetCommitish] | @tsv' 2>/dev/null); then
            read -r is_draft target_commit <<< "$release_info"
            if [[ "$is_draft" != "true" ]]; then
              echo "::error::Refusing to overwrite an already published release."
              exit 1
            fi
            if ! git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}" >/dev/null 2>&1 &&
              [[ "$target_commit" != "$GITHUB_SHA" ]]; then
              echo "::error::Existing draft belongs to another commit. Choose a new version or rerun that commit."
              exit 1
            fi
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --draft --target "$GITHUB_SHA" \
              --title "FolderSpan ${RELEASE_TAG#v}" \
              --generate-notes
          fi
          gh release view "$RELEASE_TAG" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
