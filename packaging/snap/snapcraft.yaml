name: folderspan
version: '1.0.1'
base: core24
grade: devel
confinement: strict
summary: Manage local and remote files and share across devices
description: |
  FolderSpan standard edition is a free file manager and sharing tool.
  Its own source code is Apache-2.0; bundled components retain their
  respective licenses in lib/app/resources/licenses and lib/runtime/legal.
  This strict Snap has limited filesystem access. Hidden home directories,
  removable media and other users' files are not universally accessible.
license: Apache-2.0
platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]
apps:
  folderspan:
    command: bin/FolderSpan
    extensions: [gnome]
    desktop: share/applications/folderspan.desktop
    plugs: [home, removable-media, network, network-bind]
parts:
  application:
    plugin: dump
    source: https://github.com/Qqv0V6ge/FolderSpan/releases/download/v1.0.1/desktop-linux-x64-no-pro-com.folderspan-1.0.1.tar.gz
    source-checksum: sha256/58d8958d1777eee2590b28b83c12bb92e2e21ca5d4f12a794c109b04660b53c8
    stage-packages:
      - libasound2t64
      - libxcomposite1
      - libxdamage1
      - libxfixes3
      - libxrandr2
      - libxtst6
      - libgbm1
      - libdrm2
      - libsystemd0
    override-build: |
      craftctl default
      test -x "$CRAFT_PART_INSTALL/bin/FolderSpan"
      mkdir -p "$CRAFT_PART_INSTALL/share/applications" "$CRAFT_PART_INSTALL/share/pixmaps"
      cp "$CRAFT_PROJECT_DIR/local/folderspan.desktop" "$CRAFT_PART_INSTALL/share/applications/"
      sed -i 's|Exec=folderspan %U|Exec=FolderSpan %U|' "$CRAFT_PART_INSTALL/share/applications/folderspan.desktop"
      cp "$CRAFT_PART_INSTALL/lib/FolderSpan.png" "$CRAFT_PART_INSTALL/share/pixmaps/folderspan.png"
