id: com.folderspan.FolderSpan
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: folderspan

finish-args:
  - --share=ipc
  - --socket=x11
  - --device=dri
  - --share=network
  - --filesystem=host
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.Notifications

modules:
  - name: folderspan
    buildsystem: simple
    build-commands:
      - install -d /app/folderspan
      - cp -a FolderSpan/. /app/folderspan/
      - install -Dm755 folderspan /app/bin/folderspan
      - install -Dm644 com.folderspan.FolderSpan.desktop /app/share/applications/com.folderspan.FolderSpan.desktop
      - install -Dm644 com.folderspan.FolderSpan.metainfo.xml /app/share/metainfo/com.folderspan.FolderSpan.metainfo.xml
      - install -Dm644 icon-512.png /app/share/icons/hicolor/512x512/apps/com.folderspan.FolderSpan.png
    sources:
      - type: dir
        path: ../../app/desktopApp/build/compose/binaries/main-release/app/FolderSpan
        dest: FolderSpan
      - type: file
        path: folderspan
      - type: file
        path: com.folderspan.FolderSpan.desktop
      - type: file
        path: com.folderspan.FolderSpan.metainfo.xml
      - type: file
        path: ../../app/desktopApp/src/main/resources/packaging/icon-512.png
