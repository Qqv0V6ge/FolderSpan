Description: |-
  FolderSpan standard edition is a free file manager and sharing tool.
  Browse local files, connect remote storage and share files between devices.
  Network connections and transfers exchange the data needed by the services
  selected by the user. Available capabilities depend on platform permissions.
  No FolderSpan account is required. The standard edition has no ads or in-app
  purchases. Third-party components retain their own license terms.
